<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Olivia’s basketball tips</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
        background: #fff8ef;
        color: #bd430a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 2rem;
      }

      h1 {
        margin: 0;
        max-width: 16ch;
        font-size: clamp(2.5rem, 8vw, 6rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.05em;
        text-align: center;
        text-wrap: balance;
      }

      img {
        display: block;
        width: min(70vw, 22rem);
        height: auto;
        border-radius: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Olivia’s basketball tips</h1>
      <img src="assets/basketball.png" alt="An orange basketball with black seams" width="1024" height="1024">
    </main>
  </body>
</html>
